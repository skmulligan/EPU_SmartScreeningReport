[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-report"
version = "0.1.0"
description = "Create PDF reports from EPU cryo-EM screening sessions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mrcfile>=1.5",
    "numpy>=1.26",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[project.gui-scripts]
screening-report = "screening_report.gui:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
