[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "screening-report"
version = "0.1.0"
description = "Generate PDF reports from cryo-EM screening sessions collected with EPU or SerialEM."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "mrcfile>=1.5",
    "numpy>=1.26",
    "Pillow>=10.0",
    "reportlab>=4.0",
]

[project.gui-scripts]
screening-report = "screening_report.gui:main"

[tool.setuptools.package-data]
screening_report = ["themes/*.json"]

[tool.setuptools.packages.find]
include = ["screening_report*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
